[package]
name = "magic-cursor-win"
version = "0.1.0"
edition = "2021"
authors = ["MagicCursor Team"]
description = "Hyper-lightweight, high-performance background AI cursor utility for Windows"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "6.0"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
futures-util = "0.3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }
