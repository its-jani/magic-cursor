name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned on purpose: a new stable release can add pedantic lints, and the bump
  # should be a reviewed commit rather than a red build on an unrelated PR.
  RUST_TOOLCHAIN: 1.99.0

jobs:
  quality:
    name: Format, lint, and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The lint level lives in Cargo.toml; `-D warnings` turns every finding
      # into a build failure so warnings cannot accumulate.
      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features
